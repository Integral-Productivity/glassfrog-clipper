# Requires every contributor to accept CLA.md before their pull request can merge.
#
# Why this exists: the CLA is what keeps Integral Productivity LLC able to
# license this work commercially as well as under the GPL. That option survives
# only while one party can license the whole work, so the agreement has to be
# unbypassable rather than merely documented. See CLA.md.
#
# Signatures are stored in this repository at .github/cla-signatures.json —
# no external service holds them.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check or record CLA acceptance
        if: >-
          (github.event.issue.pull_request
            && contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA'))
          || github.event_name == 'pull_request_target'
        # contributor-assistant/github-action v2.6.1 — pinned by SHA because this
        # is a third-party action holding write access to the repository.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: '.github/cla-signatures.json'
          path-to-document: 'https://github.com/Integral-Productivity/glassfrog-clipper-chrome-extension/blob/main/CLA.md'
          branch: 'main'
          allowlist: kraigparkinson,dependabot[bot],bot*
          custom-notsigned-prcomment: >-
            Thanks for the pull request. Before it can be merged, please read
            [the Contributor Licence Agreement](https://github.com/Integral-Productivity/glassfrog-clipper-chrome-extension/blob/main/CLA.md)
            and accept it by posting the comment below. Its opening paragraphs
            explain why it is asked for — your contribution stays free software
            either way. You only do this once, ever.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have accepted the CLA. Thank you.'
