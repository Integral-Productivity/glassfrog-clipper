# Automated Claude review of every pull request.
#
# DIRECT-ACTION STAND-IN FOR THE TIER-1 CALLER.
# ---------------------------------------------
# Tier-1 repos get this by calling the org's private reusable:
#
#   uses: Integral-Productivity/devops-excellence/.github/workflows/reusable-claude-code-review.yml@v1
#     secrets:
#       CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
#
# This repo cannot use that form. It is headed for public visibility, and a
# public repo cannot resolve a reusable workflow hosted in a private repo — the
# call fails at workflow startup, not at runtime. So this file wires
# `anthropics/claude-code-action` DIRECTLY instead, inlining what the reusable
# does. That works today on the private repo AND survives the visibility flip
# unchanged.
#
# This is Stage 1 of the tier-3 -> tier-1 transition. At Stage 4, once
# Integral-Productivity/devops-excellence#603 provides a publicly-resolvable
# host for the tier-1 reusables, this file gets swapped for the canonical
# caller above. Keep this comment until that swap happens — otherwise the
# reason for the divergence is archaeology.
#
# CONTEXTS WHERE THE REVIEW IS SKIPPED, NOT RUN
# ----------------------------------------------
# Two contexts get a SKIPPED (grey) check and no review, because GitHub
# STRUCTURALLY withholds CLAUDE_CODE_OAUTH_TOKEN from them:
#
#   1. Dependabot-triggered runs, which read the Dependabot secret store rather
#      than the Actions store. We deliberately do not provision the token
#      there — a dependency bump is gated by typecheck, test, and build, not by
#      a prose review of a version string.
#   2. `pull_request` runs from FORKED head repos, to which GitHub passes no
#      secrets at all. This matters more once the repo is public.
#
# The skip is at the JOB level on purpose. A job whose every step is gated off
# still concludes SUCCESS — which is how a green "reviewed" check gets painted
# on a PR nothing reviewed. A job skipped by `if:` reports grey instead.
# Any OTHER run reaching the action with an empty token is a real
# misconfiguration and fails RED at the precheck below.
#
# `github.actor` is the predicate, not `github.event.pull_request.user.login`
# (the PR author — a human pushing to a dependabot/* branch fires `synchronize`
# WITH Actions-scoped secrets and should be reviewed) and not
# `github.triggering_actor` (which becomes the human who clicked Re-run, while
# secret scope still follows the original event).
#
# WHY THE PROMPT CARRIES `--comment` (issue #108)
# ------------------------------------------------
# Between landing in PR #78 and 2026-09-02 this workflow ran on every pull
# request, concluded green every time, and posted NOTHING — not one comment
# anywhere in the repo, across roughly $4.30 of model spend. One run did the
# full five-agent fan-out for four and a half minutes and said nothing.
#
# The cause was a single missing flag. Upstream commit e4f68203 (2025-12-15,
# "Make no-comment the default for /code-review") inverted the command's
# default. `plugins/code-review/commands/code-review.md` step 7 now reads:
#
#   > If `--comment` argument was NOT provided, stop here.
#   > Do not post any GitHub comments.
#
# This workflow passed the bare command. Every run was obeying that
# instruction exactly — reviewing the diff properly, writing the findings to a
# terminal nobody was reading, and posting nothing. Nothing was broken; the
# reviewer was being told to keep the result to itself.
#
# `--comment` also buys the positive clean signal issue #108 asks for. The same
# step 7: "If `--comment` IS provided and NO issues were found, post a summary
# comment." So a healthy pass now leaves "## Code review — No issues found."
# on the PR, and silence stops being ambiguous.
#
# NOTE on the issue's stated causes: #108 attributed the silence partly to a
# "score less than 80" filter and to an agent reading `git blame` without
# permission. Neither exists in the command that runs. Both are in
# `plugins/code-review/README.md`, which was last updated 2025-12-15 and
# describes a design the command shed in its 2026-01-08 and 2026-01-16
# rewrites. Read `commands/code-review.md`, not the README beside it.
#
# WHY THE PROMPT CARRIES THE CLAUDE-AUTHORED OVERRIDE (issue #114)
# ----------------------------------------------------------------
# The command's step 1 dispatches a Haiku agent to stop early if the PR "does
# not need code review (e.g. automated PR ...)". Every pull request here is
# opened by a Claude session on a `claude/*` branch with a "Generated with
# Claude Code" trailer — that is the branch convention auto-merge keys on, so
# it is not going to change.
#
# Upstream opposes that bullet with a bare note ("Still review Claude generated
# PR's"), and the run evidence shows the note winning only sometimes: runs
# split cleanly into 5-7 turns / ~22s (the bail) and 22-51 turns / 96-264s (the
# real fan-out). A note losing to a bullet roughly half the time is a coverage
# coin flip, so the prompt below states the repo's convention explicitly rather
# than leaving it to a judgment call on prose.
#
# This makes the bail rarer. It cannot make it impossible — it is still a model
# decision. The emission assertion below is what actually guarantees the skip
# is visible.
#
# WHY THE JOB ASSERTS AN ARTIFACT AFTERWARDS (issue #108)
# -------------------------------------------------------
# The two fixes above make the reviewer speak on the paths we know about. The
# assertion covers the paths we do not: it fails the job RED, and says so on
# the PR, whenever the run finishes having left no review artifact at all.
#
# It asserts "this PR carries a review", NOT "this run produced one". That
# distinction is load-bearing. Step 1 of the command also bails when "Claude has
# already commented on this PR", so on every `synchronize` after the first the
# reviewer legitimately posts nothing. An assertion demanding a fresh comment
# per run would fail red on every subsequent push to a healthy PR.

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# The repo default is `default_workflow_permissions: read`, which grants only
# contents/packages read — everything else defaults to `none`. pull-requests is
# WRITE so the bot can post a PR review AND so the assertion step can post its
# silence notice; contents stays read (the reviewer only reads code), issues
# stays read (the review path does not touch issues), and id-token is for OIDC.
permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude Code Review
    if: >-
      github.actor != 'dependabot[bot]'
      && github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-latest
    steps:
      # Reaching this step with an empty token means a real misconfiguration —
      # the job-level `if:` has already excluded every context where the token
      # is legitimately absent. So it fails RED rather than emitting a warning
      # nobody reads. There is deliberately no soft `ready` output gating the
      # steps below: this step either exits 1 (job red, nothing downstream
      # runs) or exits 0 (everything downstream runs).
      #
      # Do NOT interpolate the secret into the ::error:: text — GitHub expands
      # ${{ }} inside `run:` before bash sees it, which would print the real
      # token into the annotation.
      - name: Verify CLAUDE_CODE_OAUTH_TOKEN is configured
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${OAUTH_TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is empty in the Actions secrets scope, and this run is not a known-tokenless context (Dependabot-triggered runs and fork PRs are skipped at the job level, by design)."
            echo "::error::Provision it org-wide: run 'claude setup-token' locally to mint a long-lived token, then: gh secret set CLAUDE_CODE_OAUTH_TOKEN --org Integral-Productivity --visibility all"
            exit 1
          fi
          echo "CLAUDE_CODE_OAUTH_TOKEN is present — running the review."

      - name: Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # The PR reference stays alone on the first line: everything after the
      # command name reaches the command as its argument string, and step 7
      # tests for `--comment` textually. The paragraph below it is context for
      # the eligibility agent, not an argument.
      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }} --comment

            Context for the eligibility check in step 1: every pull request in this
            repository is opened by a Claude Code session, lives on a `claude/*` branch,
            and carries a "Generated with Claude Code" trailer. That is this repository's
            branch convention — it is what auto-merge keys on — and it is not a signal
            that the change is machine-generated boilerplate or otherwise exempt. Do NOT
            classify this pull request as an "automated pull request" that does not need
            review. Review it on its contents, as you would any hand-authored change.
          # Our automation Apps drive PRs (ip-automerge pushes branch updates,
          # producing a non-human `synchronize`; ip-adopt-standard opens the
          # org-wide adopt-standard PRs). Without this they hard-fail the
          # action's "workflow initiated by non-human actor" guard. Dependabot
          # is deliberately absent — those runs never reach here.
          allowed_bots: 'ip-automerge,ip-automerge-bot,ip-adopt-standard'

      # Runs only when the action above succeeded — a failed action is already
      # red for a stated reason. This step exists for the case that failed
      # #108: the action reporting success having produced nothing.
      #
      # The HTML marker excludes this step's own notices from the count.
      # Without it the first silent run would post a notice as
      # github-actions[bot], and the next run would find that notice and pass
      # green — an assertion satisfied by its own failure message.
      #
      # Posting the notice is best-effort; the RED is not. If the comment
      # cannot be posted the step still exits 1, so a permissions gap degrades
      # to "red without explanation" rather than to a false green.
      - name: Assert the review left an artifact on this PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MARKER: '<!-- claude-review-silence-notice -->'
        run: |
          set -euo pipefail

          # Counts comments authored by the identities this action can post
          # under: claude[bot] when the Claude App token is available,
          # github-actions[bot] when it falls back to GITHUB_TOKEN.
          # An API failure here exits non-zero via `set -e`, which is correct —
          # "we could not tell" must never be reported as "we found one".
          count_claude() {
            gh api "$1" --paginate --jq '
              .[]
              | select(.user.type == "Bot")
              | select(.user.login | ascii_downcase | test("^(claude|github-actions)"))
              | select(((.body // "") | contains(env.MARKER)) | not)
              | .id
            ' | wc -l | tr -d ' '
          }

          summary=$(count_claude "repos/${REPO}/issues/${PR}/comments")
          inline=$(count_claude "repos/${REPO}/pulls/${PR}/comments")
          reviews=$(count_claude "repos/${REPO}/pulls/${PR}/reviews")
          total=$(( summary + inline + reviews ))

          echo "Review artifacts on PR #${PR}: ${summary} summary, ${inline} inline, ${reviews} review(s)."

          if [ "$total" -gt 0 ]; then
            echo "The reviewer left something readable on this pull request."
            exit 0
          fi

          gh pr comment "$PR" --repo "$REPO" --body "${MARKER}
          ### Claude Code Review produced no output

          This check ran to completion and left no review on this pull request — no
          summary comment, no inline comment, no review. A run that found nothing and a
          run that never reviewed anything look identical from here, so the job is
          failing red rather than painting a green check over work nobody can audit.

          The reviewer is passed \`--comment\`, so a clean pass is expected to post
          \"## Code review — No issues found. Checked for bugs and CLAUDE.md
          compliance.\" Silence means it did not run, stopped at its eligibility check,
          or could not post.

          [Run log](${RUN_URL})

          _Posted by the workflow, not by the reviewer. This is not a review._" \
            || echo "::warning::Could not post the silence notice; failing red regardless."

          echo "::error::Claude Code Review completed successfully but left no review artifact on PR #${PR}. See issue #108 — a green check for a review nobody can read is the defect this assertion exists to catch."
          exit 1
