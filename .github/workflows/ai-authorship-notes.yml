# Carries a git-ai authorship note from a merged pull request's commit onto the
# squashed commit that actually lands on main.
#
# Why this exists: squash-merging builds a NEW commit server-side and leaves the
# commit the note was attached to unreachable from main. The attribution does not
# follow the change, so a clone resolves nothing for anything merged through a
# pull request. Measured before this workflow existed: 12 of 74 notes resolved on
# main, and all 12 were bootstrap commits predating the pull-request workflow.
# See docs/adr/0009 and issue #71.
#
# What makes a transfer sound: a note records per-file LINE RANGES keyed to one
# commit's diff. Ranges are only valid for the squashed commit if the squashed
# commit introduces byte-identical changes. On a repository whose whole claim is
# a record you can check rather than trust, wrong attribution is worse than
# absent attribution — so the diff comparison below is the gate, and nothing is
# recorded when it does not hold.
#
# It used to gate on `commits == 1` as well, at job level, and ADR 0023 removed
# that. Two things were wrong with it. The count is a proxy for the diff check,
# which is strictly stronger and already runs. And because the condition sat on
# the job, a failing one skipped the whole job — no steps, no runner, no log —
# so every ::warning:: in this file was unreachable and a forfeited note was
# indistinguishable from a healthy no-op. Half of this workflow's runs were
# skipped that way (#163).
#
# The note is also no longer read from `head.sha` alone. Bringing a branch up to
# date creates a merge commit that becomes the new head and carries no note,
# while the authored commit underneath it still does. See ADR 0023 and #147.
name: AI authorship notes

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

# Notes live on a single ref, so two merges landing together would race to push
# it. Serialize rather than cancel: a skipped run silently loses attribution,
# which is the exact failure this workflow exists to prevent.
concurrency:
  group: ai-authorship-notes
  cancel-in-progress: false

jobs:
  copy-note:
    # A fork's notes live in the fork, never in this repository's refs/notes/ai,
    # so there is nothing to copy and the token would be read-only anyway.
    # No commit-count condition here, deliberately: a job-level `if` that fails
    # skips every step, so the forfeit it causes cannot be reported. See ADR 0023.
    if: >-
      github.event.pull_request.merged == true
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Check out the BASE branch, not the pull request. On a `pull_request`
      # event actions/checkout defaults to `refs/pull/N/merge`, which puts the
      # pull request's own content in the working tree of a job holding
      # `contents: write` — the pattern CodeQL flags as "checkout of untrusted
      # code in a non-privileged context" (alert 4 on #84).
      #
      # No step here executes anything from the tree — every step is git
      # plumbing plus an inline script — and the job only runs on a *merged*
      # same-repository pull request, so the content is already on `main` by
      # then. But the working tree is not needed at all: the commits this job
      # reasons about are fetched by explicit SHA below. Checking out the base
      # branch removes the exposure rather than relying on the guard above and
      # on no future step ever running something from the tree.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Copy the authorship note onto the squashed commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The ref may not exist yet on a repository that has never pushed notes.
          # That is a legitimate empty state, not a failure.
          git fetch origin '+refs/notes/ai:refs/notes/ai' 2>/dev/null || {
            echo "No refs/notes/ai on origin yet — nothing to copy."
            exit 0
          }

          # The head commit is unreachable once the branch is auto-deleted on
          # merge, so it must be fetched by explicit SHA. GitHub still serves it.
          # No --depth here: this is a full clone, and a shallow fetch would cut
          # off ${HEAD_SHA}^, which the diff guard below needs.
          git fetch origin "$HEAD_SHA" 2>/dev/null || true

          # The squashed commit comes along with the base branch checkout, but
          # fetch it explicitly too: this job no longer checks out the pull
          # request, so its presence should not depend on how far `main` had
          # advanced when the runner cloned it.
          git fetch origin "$MERGE_SHA" 2>/dev/null || true

          if ! git cat-file -e "${MERGE_SHA}^{commit}" 2>/dev/null; then
            echo "::warning::Squashed commit $MERGE_SHA is not available here,"
            echo "::warning::so its authorship note cannot be written."
            exit 0
          fi

          if git notes --ref=ai show "$MERGE_SHA" >/dev/null 2>&1; then
            echo "$MERGE_SHA already carries a note — leaving it alone."
            exit 0
          fi

          # The commit count is an observation now, not a condition (ADR 0023).
          # Reported so the skipped/success ratio #163 measured can be re-measured
          # without reading every run's diff by hand.
          echo "::notice::$(node scripts/authorship-note-source.ts --describe "$PR_COMMITS" 2>/dev/null || echo "${PR_COMMITS}-commit pull request")"

          # Candidates, head first: on the ordinary one-commit pull request that
          # is the answer and nothing else is read. The rest are the pull
          # request's own commits, because bringing a branch up to date makes
          # head.sha a merge commit that never carries a note while the authored
          # commit underneath it still does (#147).
          CANDIDATES="$HEAD_SHA"
          for sha in $(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" \
                         --paginate --jq '.[].sha' 2>/dev/null | tac); do
            case " $CANDIDATES " in *" $sha "*) ;; *) CANDIDATES="$CANDIDATES $sha";; esac
          done

          MERGE_DIGEST=$(git diff "${MERGE_SHA}^" "$MERGE_SHA" | sha256sum | cut -d' ' -f1)

          # Measure each candidate, then let the tested module choose. The shape
          # is deliberate: bash observes, the module decides, so the fixtures in
          # test/authorship-notes-workflow.test.ts are evidence about what runs.
          # Measure each candidate into a flat file: bash observes, the tested
          # module parses and decides. Building JSON in a shell is where quoting
          # bugs live, and this file is the seam that keeps them out.
          : > /tmp/candidates.txt
          for sha in $CANDIDATES; do
            git fetch origin "$sha" 2>/dev/null || true
            if git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              if git notes --ref=ai show "$sha" >/dev/null 2>&1; then HAS_NOTE=true; else HAS_NOTE=false; fi
              DIGEST=$(git diff "${sha}^" "$sha" | sha256sum | cut -d' ' -f1)
            else
              HAS_NOTE=false
              DIGEST='-'
            fi
            echo "$sha $HAS_NOTE $DIGEST" >> /tmp/candidates.txt
          done

          OUTCOME=$(node scripts/authorship-note-source.ts \
            --candidates /tmp/candidates.txt --merge-digest "$MERGE_DIGEST")
          KIND=$(printf '%s' "$OUTCOME" | python3 -c 'import json,sys; print(json.load(sys.stdin)["kind"])')

          if [ "$KIND" = "none" ]; then
            echo "No authorship note on any commit in this pull request — nothing to copy."
            exit 0
          fi

          if [ "$KIND" = "forfeit" ]; then
            # A note existed and could not be carried. That is a LOSS, and it
            # used to be indistinguishable from a healthy no-op at a glance.
            REASON=$(printf '%s' "$OUTCOME" | python3 -c 'import json,sys; print(json.load(sys.stdin)["reason"])')
            LOST=$(printf '%s' "$OUTCOME" | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)["candidates"]))')
            echo "::warning::An authorship note exists on $LOST but was not carried onto $MERGE_SHA:"
            echo "::warning::$REASON."
            echo "::warning::Attribution is forfeited for this merge. See ADR 0023 and #163."
            exit 0
          fi

          HEAD_SHA=$(printf '%s' "$OUTCOME" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          echo "Carrying the note from $HEAD_SHA (diff verified byte-identical to $MERGE_SHA)."

          # base_commit_sha names the commit the note describes. Carrying it over
          # verbatim would leave the note pointing at a commit that is not on main.
          git notes --ref=ai show "$HEAD_SHA" > /tmp/note.txt
          MERGE_SHA="$MERGE_SHA" python3 - <<'PY' > /tmp/note.new
          import json, os, sys
          raw = open("/tmp/note.txt").read()
          marker = "---\n"
          i = 0 if raw.startswith(marker) else raw.find("\n" + marker)
          if i < 0:
              sys.exit("Unrecognised note format: no '---' delimiter.")
          head, body = (("", raw[len(marker):]) if i == 0
                        else (raw[:i + 1], raw[i + 1 + len(marker):]))
          note = json.loads(body)
          note["base_commit_sha"] = os.environ["MERGE_SHA"]
          sys.stdout.write(head + marker + json.dumps(note, indent=2) + "\n")
          PY

          git notes --ref=ai add -F /tmp/note.new "$MERGE_SHA"

          # Another merge may have advanced the ref between our fetch and this
          # push. Re-fetch and re-apply rather than clobbering their note.
          for attempt in 1 2 3; do
            if git push origin refs/notes/ai; then
              echo "Carried the authorship note from $HEAD_SHA onto $MERGE_SHA."
              exit 0
            fi
            echo "Notes ref moved under us; retrying ($attempt/3)."
            git update-ref -d refs/notes/ai
            git fetch origin '+refs/notes/ai:refs/notes/ai'
            # Written as an if: `cmd && exit 0` would abort the whole script
            # under `set -e` on the ordinary path where the note is still absent.
            if git notes --ref=ai show "$MERGE_SHA" >/dev/null 2>&1; then
              echo "Another run published the note for $MERGE_SHA."
              exit 0
            fi
            git notes --ref=ai add -F /tmp/note.new "$MERGE_SHA"
          done

          echo "::error::Could not push refs/notes/ai after 3 attempts."
          echo "::error::The note for $MERGE_SHA was not published. Re-run this job,"
          echo "::error::or copy it locally with:"
          echo "::error::  git notes --ref=ai copy $HEAD_SHA $MERGE_SHA && git push origin refs/notes/ai"
          exit 1
