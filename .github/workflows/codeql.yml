# Standalone CodeQL analysis.
#
# DIRECT-ACTION STAND-IN FOR THE TIER-1 CALLER.
# ---------------------------------------------
# Tier-1 repos get CodeQL by calling the org's private reusable:
#
#   uses: Integral-Productivity/devops-excellence/.github/workflows/reusable-codeql.yml@v1
#
# This repo cannot use that form. It is headed for public visibility, and a
# public repo cannot resolve a reusable workflow hosted in a private repo — the
# call fails at workflow startup, not at runtime. So this file wires
# `github/codeql-action` DIRECTLY instead, mirroring what the reusable does.
# That works today on the private repo AND survives the visibility flip
# unchanged.
#
# This is Stage 1 of the tier-3 -> tier-1 transition. At Stage 4, once
# Integral-Productivity/devops-excellence#603 provides a publicly-resolvable
# host for the tier-1 reusables, this file gets swapped for the canonical
# caller above. Keep this comment until that swap happens — otherwise the
# reason for the divergence is archaeology.
#
# WHY STANDALONE, AND WHY schedule + workflow_dispatch ONLY (ADR-035)
# -------------------------------------------------------------------
# CodeQL must NOT be folded into ci.yml. Two observed failure modes drive this:
#
#   1. SARIF collision. GHAS *default setup* owns push/PR-time CodeQL. An
#      advanced workflow uploading SARIF for a SHA default setup already
#      scanned is rejected with "CodeQL analyses from advanced configurations
#      cannot be processed when the default setup is enabled". Hence no `push`
#      and no `pull_request` trigger here — do not add them.
#   2. Whole-gate auto-disable. Toggling default setup auto-disables whichever
#      workflow GitHub detects as the advanced CodeQL config. If CodeQL were
#      bundled into ci.yml, that toggle would take Typecheck/Test/Build offline
#      with it. Keeping CodeQL in its own file means the blast radius of that
#      toggle is this file and nothing else.
#
# See devops-excellence ADR-035 (standalone, not bundled) and ADR-024
# (default setup is the source of the required `CodeQL` rollup check).
#
# LANGUAGE
# --------
# `javascript-typescript` covers this MV3 Chrome extension's TypeScript source.
# No Swift entry: open PR #66 adds an Xcode project, but it is unmerged, so a
# `swift` row would fail the scheduled run against source that is not on main
# yet. Extending the matrix when #66 lands is tracked in #77 (Swift also needs
# a macOS runner, so it is a per-language `runs-on` matrix, not just another
# entry in this list).
#
# NOTE — GHAS default setup is ALREADY `configured` on this repo (weekly,
# extended suite, javascript-typescript among its languages), so CodeQL is
# already scanning push/PR here. Whether this advanced workflow's scheduled
# SARIF upload coexists with that, or is rejected as an overlapping
# configuration, is unverified — tracked in #76, to be settled by a
# `workflow_dispatch` run once this merges.

name: CodeQL

on:
  schedule:
    # Weekly, Monday 08:00 UTC — the org-standard CodeQL cadence. The schedule
    # lives here rather than in a reusable because GitHub does not allow a
    # reusable workflow to declare `schedule` triggers.
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: 'javascript-typescript'

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
