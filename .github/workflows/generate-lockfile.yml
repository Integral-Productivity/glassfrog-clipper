# TEMPORARY. Generates package-lock.json on Linux and uploads it as an artifact,
# so the lockfile committed to the repo records the native binaries CI actually
# resolves (@esbuild/linux-x64 and friends). Delete once the lockfile is in.
#
# This replaces the plan's Docker-on-Linux recipe with the platform CI genuinely
# uses, which is strictly closer to the thing being guaranteed.
name: Generate lockfile

on:
  push:
    branches: [claude/zero-decision-capture-path-cfce74]

permissions:
  contents: read
  packages: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@integral-productivity'

      - name: Resolve the dependency tree
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}
        run: npm install --no-audit --no-fund

      - name: Report what the lockfile records
        run: |
          echo "lockfileVersion: $(node -p "require('./package-lock.json').lockfileVersion")"
          echo "total packages:  $(node -p "Object.keys(require('./package-lock.json').packages).length")"
          echo "--- esbuild platform binaries recorded ---"
          node -p "Object.keys(require('./package-lock.json').packages).filter(k => k.includes('@esbuild/')).join('\n') || 'NONE'"
          echo "--- the SDK ---"
          node -p "JSON.stringify(require('./package-lock.json').packages['node_modules/@integral-productivity/glassfrog'], null, 1)"

      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
